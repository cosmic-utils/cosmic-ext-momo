[package]
name = "cosmic-ext-toot"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/edfloreshz/toot"

[dependencies]
dirs = "7.0.0"
futures-channel = "0.3.34"
futures-util = "0.3.34"
html2text = "0.17.4"
i18n-embed-fl = "0.10.1"
keytar = "0.1.6"
open = "5.4.5"
reqwest = "0.13.5"
regex = "1.13.1"
unicode-segmentation = "1.13.3"
uuid = { version = "1.29.2", features = ["v4"] }
rust-embed = "8.13.0"
thiserror = "2.0.21"
tracing = "0.1.44"
megalodon = "1.3.0"

[dependencies.tokio]
version = "1.54.1"
features = ["rt", "time", "fs", "io-util"]

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.154"

[dependencies.chrono]
version = "0.4.45"
features = ["serde"]

[dependencies.tracing-subscriber]
version = "0.3.23"
features = ["env-filter"]

[dependencies.i18n-embed]
version = "0.16.0"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = [
    # About widget for the app
    "about",
    # Support creating additional application windows.
    "multi-window",
    # On app startup, focuses an existing instance if the app is already open
    "single-instance",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Windowing support for X11, Windows, Mac, & Redox
    "winit",
    # GPU-accelerated rendering
    "wgpu",
]

[target.'cfg(target_os = "linux")'.dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = [
    # Accessibility support
    "a11y",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
    # Add Wayland support to winit
    "wayland",
    "xdg-portal",
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
